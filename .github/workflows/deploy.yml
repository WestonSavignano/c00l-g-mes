name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      UPSTREAM_ORIGIN: ${{ vars.UPSTREAM_ORIGIN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render Vercel routing config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')

          const required = ['UPSTREAM_ORIGIN', 'VERCEL_ORG_ID', 'VERCEL_PROJECT_ID']
          for (const name of required) {
            if (!process.env[name]) {
              throw new Error(`Missing required GitHub repository configuration for ${name}`)
            }
          }

          const upstream = new URL(process.env.UPSTREAM_ORIGIN)
          if (upstream.protocol !== 'https:') {
            throw new Error('UPSTREAM_ORIGIN must use https')
          }
          if (
            upstream.username ||
            upstream.password ||
            upstream.pathname !== '/' ||
            upstream.search ||
            upstream.hash
          ) {
            throw new Error('UPSTREAM_ORIGIN must be an origin only, e.g. https://example.com')
          }

          const template = fs.readFileSync('vercel.template.json', 'utf8')
          const marker = '__UPSTREAM_ORIGIN__'
          const matches = template.split(marker).length - 1
          if (matches !== 1) {
            throw new Error(`Expected exactly one ${marker} marker; found ${matches}`)
          }

          fs.writeFileSync('vercel.json', template.replace(marker, upstream.origin))
          JSON.parse(fs.readFileSync('vercel.json', 'utf8'))
          NODE

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "Missing required GitHub Actions secret: VERCEL_TOKEN" >&2
            exit 1
          fi

          args=(deploy --yes --token="$VERCEL_TOKEN")
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            args+=(--prod)
          fi

          deployment_url="$(npx --yes vercel@59.19.1 "${args[@]}")"
          {
            echo "## Vercel deployment"
            echo
            echo "- Event: `$GITHUB_EVENT_NAME`"
            echo "- URL: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"
